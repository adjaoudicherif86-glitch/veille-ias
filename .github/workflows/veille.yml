name: Chasse aux nouveautés IA

on:
  schedule:
    - cron: "17 */4 * * *"   # toutes les 4 heures
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  chasse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Lâcher le chien
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_URL: ${{ vars.LLM_API_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          MAX_ANALYSES: ${{ vars.MAX_ANALYSES || '20' }}
          MAX_ANALYSES_CONTROLE: ${{ vars.MAX_ANALYSES_CONTROLE || '8' }}
        run: python veille.py

      - name: Enregistrer les trouvailles
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add docs/data etat
          git diff --cached --quiet || git commit -m "Veille IA $(date -u +'%Y-%m-%d %H:%M')"
          git push
