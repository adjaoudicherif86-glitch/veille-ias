name: "Pièce Unique : fiabilité des boutiques"
on:
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fiabilite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python mode/fiabilite.py
      - run: |
          git config user.name "veille-bot"; git config user.email "veille-bot@users.noreply.github.com"
          git add docs/mode/fiabilite.json; git diff --cached --quiet || git commit -m "Pièce Unique : fiabilité des boutiques"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
