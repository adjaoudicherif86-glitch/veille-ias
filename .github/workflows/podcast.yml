name: "Flair FM : épisode du jour"

on:
  schedule:
    - cron: "41 5 * * *"   # chaque matin vers 6 h 40 (heure de Paris en hiver), après la chasse de 4 h 17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy scipy lameenc
      - name: Fabriquer l'épisode
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_TTS_MODEL: ${{ vars.LLM_TTS_MODEL }}
        run: python podcast/episode.py
      - name: Publier le fichier audio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="episode-$(date -u +%Y-%m-%d)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          F=$(ls podcast/sortie/*.mp3)
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$F" --title "Flair FM, $(date -u +%d/%m/%Y)" --notes "Épisode du jour de Flair FM." --latest=false
          # étiquette audio-… : un commit isolé qui ne contient que le MP3, hors de l'historique principal
          TAG_AUDIO="audio-$(date -u +%Y-%m-%d)"
          echo "TAG_AUDIO=$TAG_AUDIO" >> "$GITHUB_ENV"
          D=$(mktemp -d); cp "$F" "$D/"; cd "$D"
          git init -q && git add . && git -c user.name=veille-bot -c user.email=veille-bot@users.noreply.github.com commit -q -m "Flair FM : audio $TAG_AUDIO"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/tags/$TAG_AUDIO"
          cd - > /dev/null
          U="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${TAG_AUDIO}/$(basename "$F")"
          for i in 1 2 3 4 5 6; do curl -sI "$U" | tee /tmp/h.txt | head -1 | grep -q " 200" && break; sleep 10; done
          echo "Vérification jsDelivr :"; grep -iE "^HTTP|content-type|accept-ranges|content-length" /tmp/h.txt
      - name: Mettre à jour le catalogue
        run: |
          python podcast/publier.py > a_supprimer.txt
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add docs/podcast/episodes.json
          git diff --cached --quiet || git commit -m "Flair FM : épisode du $(date -u +%d/%m)"
          git pull --rebase origin main && git push
      - name: Supprimer les vieux épisodes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r t ta; do
            [ -n "$t" ] && gh release delete "$t" --yes --cleanup-tag || true
            [ -n "$ta" ] && git push -q --delete "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$ta" || true
          done < a_supprimer.txt
