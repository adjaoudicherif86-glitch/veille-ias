name: "Pièce Unique : sondage des boutiques"
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python mode/sonde.py
      - run: |
          git config user.name "veille-bot"; git config user.email "veille-bot@users.noreply.github.com"
          git add etat/mode-sondage.json; git diff --cached --quiet || git commit -m "Pièce Unique : sondage des boutiques"
          git pull --rebase origin main && git push
