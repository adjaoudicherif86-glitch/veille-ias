name: "Pièce Unique : sondage fiabilité et enseignes"
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python mode/sonde3.py
      - run: |
          git config user.name "veille-bot"; git config user.email "veille-bot@users.noreply.github.com"
          git add etat/mode-sondage-3.json; git diff --cached --quiet || git commit -m "Pièce Unique : sondage fiabilité et enseignes"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
