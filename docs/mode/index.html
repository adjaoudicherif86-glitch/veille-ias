<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pièce Unique</title>
<meta name="description" content="Vraies promos mode homme, vraies photos, tenues composées.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --mur:#e9e6e1; --papier:#f6f4f0; --encre:#151413; --doux:#6d6862; --trait:#d3cec7;
  --rouge:#b8321f; --vert:#2f5d3a; --carte:#fffdf9;
  --serif:"Bodoni Moda",Georgia,serif; --sans:"Hanken Grotesk",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --mur:#171615; --papier:#1f1e1c; --encre:#f0ece6; --doux:#a39d95; --trait:#34312e; --rouge:#e0654f; --vert:#7fb48b; --carte:#232120;}}
:root[data-theme="dark"]{--mur:#171615; --papier:#1f1e1c; --encre:#f0ece6; --doux:#a39d95; --trait:#34312e; --rouge:#e0654f; --vert:#7fb48b; --carte:#232120;}
*{box-sizing:border-box;margin:0}
body{background:var(--mur);color:var(--encre);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit}
img{display:block;max-width:100%}
.page{max-width:1240px;margin:0 auto;padding:0 16px 80px}
header{padding:34px 0 18px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--encre)}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(44px,8vw,86px);line-height:.9;letter-spacing:-.02em}
h1 em{font-style:italic;font-weight:400}
.meta{font-family:var(--mono);font-size:11.5px;color:var(--doux);text-transform:uppercase;letter-spacing:.06em;text-align:right}
.meta b{color:var(--encre);font-weight:500}
nav.onglets{display:flex;gap:22px;margin:18px 0 0;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
nav.onglets button{background:none;border:0;padding:6px 0;color:var(--doux);cursor:pointer;font:inherit;border-bottom:2px solid transparent}
nav.onglets button[aria-selected="true"]{color:var(--encre);border-color:var(--encre)}
.barre{position:sticky;top:0;z-index:5;background:var(--mur);padding:12px 0;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;border-bottom:1px solid var(--trait)}
.groupe{display:flex;flex-wrap:wrap;gap:6px}
.puce{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;padding:6px 11px;border:1px solid var(--trait);background:var(--papier);color:var(--encre);border-radius:99px;cursor:pointer}
.puce[aria-pressed="true"]{background:var(--encre);color:var(--mur);border-color:var(--encre)}
select{font-family:var(--mono);font-size:11.5px;padding:6px 8px;border:1px solid var(--trait);background:var(--papier);color:var(--encre);border-radius:6px}
.compte{font-family:var(--mono);font-size:11.5px;color:var(--doux);margin-left:auto}
/* coup du jour */
.coup{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;margin:26px 0 8px;align-items:center}
.coup .photo{background:var(--papier);aspect-ratio:4/5;overflow:hidden}
.coup .photo img{width:100%;height:100%;object-fit:cover}
.eti{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--rouge)}
.coup h2{font-family:var(--serif);font-weight:500;font-size:clamp(28px,4vw,46px);line-height:1.02;margin:8px 0 10px}
.coup p{color:var(--doux);max-width:46ch}
.prix{font-family:var(--mono);display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.prix .now{font-size:18px;font-weight:500}
.prix s{color:var(--doux);font-size:12.5px}
.prix .rem{background:var(--rouge);color:#fff;font-size:11px;padding:2px 6px}
.coup .prix .now{font-size:28px}
.bouton{display:inline-block;margin-top:16px;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;padding:11px 16px;background:var(--encre);color:var(--mur);text-decoration:none}
/* grille pièces */
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:26px 18px;margin-top:22px}
.piece{display:flex;flex-direction:column;min-width:0}
.piece .photo{position:relative;background:var(--papier);aspect-ratio:4/5;overflow:hidden}
.piece .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .25s}
.piece .photo img+img{opacity:0}
.piece .photo:hover img+img{opacity:1}
.piece .photo .rem{position:absolute;top:8px;left:8px;background:var(--rouge);color:#fff;font-family:var(--mono);font-size:11px;padding:2px 6px}
.piece .photo .forte{position:absolute;top:8px;right:8px;background:var(--carte);color:var(--encre);font-family:var(--mono);font-size:10px;padding:2px 6px;text-transform:uppercase;letter-spacing:.06em}
.piece .marque{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--doux);margin-top:10px}
.piece h3{font-weight:500;font-size:14.5px;line-height:1.3;margin:2px 0 6px;overflow-wrap:anywhere}
.piece .pq{font-size:13px;color:var(--doux);margin-top:6px}
.piece .pied{font-family:var(--mono);font-size:10.5px;color:var(--doux);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 10px}
.drap{color:var(--rouge)}
/* tenues */
.tenues{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:26px;margin-top:22px}
.tenue{background:var(--carte);border:1px solid var(--trait);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tenue .entete{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.tenue h3{font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.05}
.tenue .total{font-family:var(--mono);font-size:13px;white-space:nowrap}
.tenue .total b{font-size:18px;font-weight:500}
.planche{display:grid;gap:8px;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.planche a{display:block;background:var(--papier);aspect-ratio:3/4;overflow:hidden;position:relative}
.planche img{width:100%;height:100%;object-fit:cover}
.planche span{position:absolute;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--carte) 88%,transparent);font-family:var(--mono);font-size:10.5px;padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tenue ul{padding-left:18px;font-size:13.5px}
.tenue ul li{margin:2px 0}
.lignes{font-size:13.5px;border-top:1px solid var(--trait)}
.lignes div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--trait)}
.lignes div span:first-child{min-width:0;overflow-wrap:anywhere}
.lignes .mono{font-family:var(--mono);font-size:12px;white-space:nowrap}
.compl{color:var(--doux)}
.style-eti{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--doux)}
.vide{padding:60px 0;text-align:center;color:var(--doux);font-family:var(--mono);font-size:13px}
.boutiques{margin-top:46px;font-family:var(--mono);font-size:11px;color:var(--doux);line-height:1.8}
.boutiques b{color:var(--encre);font-weight:500}
@media (max-width:720px){
  .coup{grid-template-columns:1fr;gap:16px}
  .coup .photo{aspect-ratio:1/1}
  .grille{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}
  .meta{text-align:left}
  .compte{margin-left:0;width:100%}
}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Pièce <em>Unique</em></h1>
    <div class="meta" id="meta">Chargement…</div>
  </header>
  <nav class="onglets" role="tablist">
    <button role="tab" aria-selected="true" data-vue="pieces">Les affaires</button>
    <button role="tab" aria-selected="false" data-vue="tenues">Les tenues</button>
  </nav>
  <section id="coup"></section>
  <div class="barre">
    <div class="groupe" id="f-style"></div>
    <div class="groupe" id="f-budget"></div>
    <select id="f-cat" aria-label="Catégorie"></select>
    <select id="f-tri" aria-label="Tri">
      <option value="score">Sélection</option>
      <option value="prix">Prix croissant</option>
      <option value="remise">Plus grosse remise</option>
    </select>
    <span class="compte" id="compte"></span>
  </div>
  <main id="vue"></main>
  <div class="boutiques" id="boutiques"></div>
</div>
<script>
const STYLES={tous:"Tous",workwear:"Workwear",streetwear:"Streetwear",minimal:"Minimal",oldmoney:"Old money"};
const BUDGETS=[[0,"Tout prix"],[30,"≤ 30 €"],[60,"≤ 60 €"],[100,"≤ 100 €"]];
const CATS={tous:"Toutes les pièces",veste:"Vestes",surchemise:"Surchemises",maille:"Maille",sweat:"Sweats",chemise:"Chemises",tshirt:"T-shirts & polos",pantalon:"Pantalons",short:"Shorts",chaussures:"Chaussures",accessoire:"Accessoires"};
const etat={vue:"pieces",style:"tous",budget:0,cat:"tous",tri:"score"};
try{Object.assign(etat,JSON.parse(localStorage.getItem("pu-filtres")||"{}"))}catch(e){}
let D=null, parId={};
const eur=n=>Math.round(n).toLocaleString("fr-FR")+" €";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const drap=o=>o==="UE"?"":`<span class="drap" title="Expédié hors UE : droits de douane et TVA possibles">↗ ${o}, frais d'import possibles</span>`;
function prix(a){return `<div class="prix"><span class="now">${eur(a.prix_eur)}</span><s>${eur(a.avant_eur)}</s><span class="rem">−${a.remise} %</span></div>`}
function score(a){const p={veste:3,maille:3,surchemise:3,pantalon:2.6,chaussures:2.4,chemise:2.2,sweat:2,tshirt:1,short:.6,accessoire:.8}[a.categorie]||1;
  return a.remise/10+p+(a.prix_eur<=40?2:a.prix_eur<=70?1.3:a.prix_eur<=110?.7:0)+(a.forte?2.5:0)+(a.origine==="UE"?.8:0)}
function sauver(){try{localStorage.setItem("pu-filtres",JSON.stringify(etat))}catch(e){}}

function puces(){
  document.getElementById("f-style").innerHTML=Object.entries(STYLES).map(([k,v])=>`<button class="puce" data-style="${k}" aria-pressed="${etat.style===k}">${v}</button>`).join("");
  document.getElementById("f-budget").innerHTML=BUDGETS.map(([k,v])=>`<button class="puce" data-budget="${k}" aria-pressed="${etat.budget==k}">${v}</button>`).join("");
  const presentes=new Set(D.articles.map(a=>a.categorie));
  document.getElementById("f-cat").innerHTML=Object.entries(CATS).filter(([k])=>k==="tous"||presentes.has(k)).map(([k,v])=>`<option value="${k}" ${etat.cat===k?"selected":""}>${v}</option>`).join("");
  document.getElementById("f-tri").value=etat.tri;
  document.getElementById("f-cat").style.display=document.getElementById("f-tri").style.display=etat.vue==="pieces"?"":"none";
}
function carte(a){
  const im=a.images.slice(0,2).map((s,i)=>`<img src="${esc(s)}${s.includes("?")?"&":"?"}width=600" alt="${i?"":esc(a.nom)}" loading="lazy">`).join("");
  return `<article class="piece">
    <a class="photo" href="${esc(a.lien)}" target="_blank" rel="noopener">${im}<span class="rem">−${a.remise} %</span>${a.forte?'<span class="forte">Pièce forte</span>':""}</a>
    <div class="marque">${esc(a.marque)}</div>
    <h3><a href="${esc(a.lien)}" target="_blank" rel="noopener" style="text-decoration:none">${esc(a.nom)}</a></h3>
    ${prix(a)}
    ${a.pourquoi?`<div class="pq">${esc(a.pourquoi)}</div>`:""}
    <div class="pied"><span>${esc(a.boutique)}</span>${a.tailles.length?`<span>Tailles : ${esc(a.tailles.slice(0,8).join(" · "))}</span>`:""}${drap(a.origine)}</div>
  </article>`;
}
function tenue(t){
  const arts=t.articles.map(i=>parId[i]).filter(Boolean);
  const total=arts.reduce((s,a)=>s+a.prix_eur,0), avant=arts.reduce((s,a)=>s+a.avant_eur,0);
  return `<article class="tenue">
    <div class="style-eti">${STYLES[t.style]||""}</div>
    <div class="entete"><h3>${esc(t.nom)}</h3><div class="total"><b>${eur(total)}</b> <s style="color:var(--doux)">${eur(avant)}</s></div></div>
    ${t.accroche?`<p>${esc(t.accroche)}</p>`:""}
    <div class="planche" style="--n:${arts.length}">${arts.map(a=>`<a href="${esc(a.lien)}" target="_blank" rel="noopener"><img src="${esc(a.images[0])}${a.images[0].includes("?")?"&":"?"}width=500" alt="${esc(a.nom)}" loading="lazy"><span>${esc(a.marque)}</span></a>`).join("")}</div>
    <div class="lignes">
      ${arts.map(a=>`<div><span><a href="${esc(a.lien)}" target="_blank" rel="noopener">${esc(a.nom)}</a> · ${esc(a.boutique)} ${a.origine!=="UE"?'<span class="drap">↗ '+a.origine+'</span>':""}</span><span class="mono">${eur(a.prix_eur)} <span class="drap">−${a.remise} %</span></span></div>`).join("")}
      ${(t.complements||[]).map(c=>`<div class="compl"><span>+ ${esc(c.piece)}${c.ou?" · "+esc(c.ou):""}</span><span class="mono">${esc(c.prix||"")}</span></div>`).join("")}
    </div>
    ${(t.conseils||[]).length?`<ul>${t.conseils.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>`:""}
  </article>`;
}
function filtre(a){
  return (etat.style==="tous"||(a.styles||[]).includes(etat.style)) && (!etat.budget||a.prix_eur<=etat.budget) && (etat.cat==="tous"||a.categorie===etat.cat);
}
function rendre(){
  puces(); sauver();
  document.getElementById("coup").style.display=etat.vue==="pieces"?"":"none";
  document.querySelectorAll("nav.onglets button").forEach(b=>b.setAttribute("aria-selected",b.dataset.vue===etat.vue));
  const v=document.getElementById("vue"), c=document.getElementById("compte");
  if(etat.vue==="pieces"){
    let l=D.articles.filter(filtre);
    l.sort(etat.tri==="prix"?(a,b)=>a.prix_eur-b.prix_eur:etat.tri==="remise"?(a,b)=>b.remise-a.remise:(a,b)=>score(b)-score(a));
    c.textContent=`${l.length} pièce${l.length>1?"s":""}`;
    v.innerHTML=l.length?`<div class="grille">${l.map(carte).join("")}</div>`:`<div class="vide">Rien dans ce filtre aujourd'hui. Élargis le budget ou le style.</div>`;
  }else{
    let l=D.tenues.filter(t=>(etat.style==="tous"||t.style===etat.style)&&(!etat.budget||t.articles.reduce((s,i)=>s+(parId[i]?.prix_eur||0),0)<=etat.budget*2.5));
    c.textContent=`${l.length} tenue${l.length>1?"s":""}`;
    v.innerHTML=l.length?`<div class="tenues">${l.map(tenue).join("")}</div>`:`<div class="vide">Pas de tenue pour ce filtre aujourd'hui.</div>`;
  }
}
function coup(){
  const a=parId[D.coup]; if(!a)return;
  document.getElementById("coup").innerHTML=`<div class="coup">
    <a class="photo" href="${esc(a.lien)}" target="_blank" rel="noopener"><img src="${esc(a.images[0])}${a.images[0].includes("?")?"&":"?"}width=900" alt="${esc(a.nom)}"></a>
    <div><div class="eti">Le coup du jour · ${esc(a.marque)}</div><h2>${esc(a.nom)}</h2>${prix(a)}
    ${a.pourquoi?`<p style="margin-top:12px">${esc(a.pourquoi)}</p>`:""}
    <p style="margin-top:8px;font-family:var(--mono);font-size:11.5px">${esc(a.boutique)}${a.tailles.length?" · tailles "+esc(a.tailles.slice(0,8).join(" · ")):""} ${drap(a.origine)}</p>
    <a class="bouton" href="${esc(a.lien)}" target="_blank" rel="noopener">Voir sur le site</a></div></div>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-style],[data-budget],[data-vue]"); if(!b)return;
  if(b.dataset.style)etat.style=b.dataset.style;
  if(b.dataset.budget!==undefined)etat.budget=+b.dataset.budget;
  if(b.dataset.vue)etat.vue=b.dataset.vue;
  rendre();
});
document.getElementById("f-cat").onchange=e=>{etat.cat=e.target.value;rendre()};
document.getElementById("f-tri").onchange=e=>{etat.tri=e.target.value;rendre()};
fetch("data.json?"+Date.now()).then(r=>r.json()).then(d=>{
  D=d; D.articles.forEach(a=>parId[a.id]=a);
  const m=new Date(d.maj);
  document.getElementById("meta").innerHTML=`Mis à jour le <b>${m.toLocaleDateString("fr-FR",{day:"numeric",month:"long"})} à ${m.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}</b><br>${d.articles.length} vraies affaires · ${d.tenues.length} tenues · ${d.bilan.length} boutiques`;
  document.getElementById("boutiques").innerHTML="Boutiques lues : "+d.bilan.map(b=>`<b>${esc(b.boutique)}</b> ${b.gardes}/${b.lus}`).join(" · ")+"<br>Prix convertis en euros au taux du jour. Remise minimum 30 %, au moins deux tailles en stock. ↗ UK/US : droits de douane et TVA possibles à la livraison.";
  coup(); rendre();
}).catch(()=>{document.getElementById("vue").innerHTML='<div class="vide">Les promos du jour ne sont pas encore prêtes.</div>';document.getElementById("meta").textContent=""});
</script>
</body>
</html>
